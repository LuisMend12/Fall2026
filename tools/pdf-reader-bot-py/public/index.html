<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Reader Bot</title>
<style>
  :root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --panel-2: #f6f7f9;
    --border: #d7dbe1;
    --text: #14161a;
    --muted: #4b505a;
    --muted-2: #6b7080;
    --accent: #1d4ed8;
    --accent-hover: #1740ac;
    --accent-soft: #e4ecfd;
    --accent-soft-text: #1740ac;
    --good: #157a3d;
    --good-soft: #dff5e6;
    --bad: #b3261e;
    --bad-soft: #fbe4e2;
    --focus: #1d4ed8;
    --shadow: 0 1px 2px rgba(20, 22, 26, 0.06), 0 8px 24px rgba(20, 22, 26, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --panel: #181b21;
      --panel-2: #1e222a;
      --border: #2c313b;
      --text: #f2f3f5;
      --muted: #b7bcc7;
      --muted-2: #8a8f9c;
      --accent: #6d9bff;
      --accent-hover: #8fb1ff;
      --accent-soft: #1c2740;
      --accent-soft-text: #a8c3ff;
      --good: #4fd486;
      --good-soft: #123322;
      --bad: #ff8f87;
      --bad-soft: #3a1a1a;
      --focus: #6d9bff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 360px;
    min-width: 280px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  .sidebar-header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand-icon {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }
  .brand-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .brand-sub { font-size: 12px; color: var(--muted-2); margin-top: 1px; }
  .search-wrap { position: relative; }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--muted-2); pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 9px 10px 9px 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13.5px;
  }
  #search::placeholder { color: var(--muted-2); }
  #search:focus { border-color: var(--accent); background: var(--panel); }

  #note-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 10px 16px;
  }
  .tree-children {
    margin-left: 8px;
    border-left: 1px solid var(--border);
    padding-left: 12px;
  }
  details { margin-top: 1px; }
  details > summary.folder-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    padding: 7px 8px;
    cursor: pointer;
    border-radius: 6px;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  summary.folder-label::-webkit-details-marker { display: none; }
  summary.folder-label::before {
    content: "";
    width: 0; height: 0;
    border-left: 4px solid var(--muted-2);
    border-top: 3.5px solid transparent;
    border-bottom: 3.5px solid transparent;
    transition: transform 0.12s ease;
    flex-shrink: 0;
  }
  details[open] > summary.folder-label::before { transform: rotate(90deg); }
  details[open] > summary.folder-label { color: var(--text); }
  summary.folder-label:hover { background: var(--panel-2); }
  summary.folder-label .count { font-weight: 500; color: var(--muted-2); text-transform: none; letter-spacing: 0; }

  .note-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    margin: 1px 0;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text);
  }
  .note-item:hover { background: var(--panel-2); }
  .note-item.active { background: var(--accent); color: #fff; }
  .note-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .audio-badge {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--good);
    background: var(--good-soft);
    padding: 2px 6px;
    border-radius: 999px;
    flex-shrink: 0;
    opacity: 0;
    white-space: nowrap;
  }
  .note-item.has-audio .audio-badge { opacity: 1; }
  .note-item.active .audio-badge { background: rgba(255,255,255,0.22); color: #fff; }
  .empty-msg { padding: 16px 8px; color: var(--muted-2); font-size: 13px; }

  /* ---------- main ---------- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  #detail {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  #detail.empty { align-items: flex-start; justify-content: center; overflow-y: auto; }
  #empty-state {
    color: var(--muted-2);
    margin-top: 90px;
    text-align: center;
    font-size: 14px;
  }
  #empty-state .big { font-size: 34px; margin-bottom: 10px; }

  #detail-left {
    width: 100%;
    max-width: 640px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 32px 32px 60px 40px;
  }
  #pdf-pane {
    flex: 1;
    min-width: 0;
    border-left: 1px solid var(--border);
    background: var(--panel-2);
    display: flex;
    flex-direction: column;
  }
  #pdf-pane iframe {
    flex: 1;
    width: 100%;
    height: 100%;
    border: none;
    background: var(--panel);
  }
  .pdf-pane-header {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .pdf-pane-header a { font-weight: 600; }

  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    color: var(--muted-2);
    font-size: 12.5px;
    margin-bottom: 6px;
  }
  .breadcrumb .sep { color: var(--border); }
  h2 { margin: 0 0 20px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 160px; }
  .field label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted-2);
  }
  .field .value { font-weight: 500; color: var(--text); text-transform: none; letter-spacing: 0; }
  select, input[type=range] {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 13px;
  }
  select { min-width: 200px; }
  input[type=range] { padding: 0; accent-color: var(--accent); min-width: 140px; }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }

  #status-line {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
    min-height: 20px;
  }
  .spinner {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  progress {
    flex: 1;
    max-width: 220px;
    height: 6px;
    accent-color: var(--accent);
  }
  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .status-badge.good { background: var(--good-soft); color: var(--good); }
  .status-badge.bad { background: var(--bad-soft); color: var(--bad); }

  #player-block { margin-top: 4px; }
  audio { width: 100%; margin-bottom: 16px; }
  audio::-webkit-media-controls-panel { background: var(--panel-2); }
  #track-list {
    list-style: none;
    padding: 0;
    margin: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  #track-list li {
    padding: 10px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
  }
  #track-list li:last-child { border-bottom: none; }
  #track-list li:hover { background: var(--panel-2); }
  #track-list li.playing { background: var(--accent-soft); color: var(--accent-soft-text); font-weight: 700; }
  #track-list .track-num {
    font-variant-numeric: tabular-nums;
    color: var(--muted-2);
    font-size: 12px;
    width: 20px;
    flex-shrink: 0;
  }
  #track-list li.playing .track-num { color: var(--accent-soft-text); }
  #track-list .track-page {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted-2);
    flex-shrink: 0;
  }
  #track-list li.playing .track-page { color: var(--accent-soft-text); }

  .links { margin-top: 16px; display: flex; gap: 18px; font-size: 12.5px; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .links a:hover { text-decoration: underline; }

  .error-box {
    margin-top: 4px;
    padding: 13px 14px;
    border-radius: 9px;
    background: var(--bad-soft);
    color: var(--bad);
    font-size: 13px;
    border: 1px solid var(--bad);
  }

  /* ---------- seen tracking + quiz ---------- */
  .progress-summary {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted-2);
  }
  .progress-bar-track {
    margin-top: 5px;
    height: 4px;
    border-radius: 999px;
    background: var(--panel-2);
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .badges { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .seen-badge {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .note-item.active .seen-badge { background: rgba(255,255,255,0.22); color: #fff; }

  .secondary-row { display: flex; gap: 10px; margin: 4px 0 20px; }
  .secondary-btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .secondary-btn:hover { background: var(--border); }
  .secondary-btn.active { background: var(--good-soft); color: var(--good); border-color: var(--good); }

  .quiz-card { margin-top: 4px; }
  .quiz-card h3 { margin: 0 0 14px; font-size: 15px; }
  .quiz-q { margin-bottom: 16px; }
  .quiz-q p { margin: 0 0 8px; font-weight: 600; font-size: 13.5px; }
  .quiz-opts { display: flex; flex-direction: column; gap: 6px; }
  .quiz-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .quiz-opt:hover { background: var(--panel-2); }
  .quiz-opt.correct { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .quiz-opt.incorrect { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .quiz-opt-idk { color: var(--muted-2); font-style: italic; }
  .quiz-explain {
    display: none;
    margin-top: 8px;
    padding: 9px 11px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .quiz-explain.shown { display: block; }
  .quiz-explain strong { color: var(--text); }
  .quiz-explain .ctx-dim { color: var(--muted-2); }
  .quiz-explain .ctx-main { color: var(--text); font-weight: 600; }
  #quiz-result { margin-top: 14px; display: flex; align-items: center; gap: 10px; }
  .quiz-loading { color: var(--muted-2); font-size: 13px; padding: 10px 0; }

  .summary-card { margin-top: 4px; }
  .summary-card h3 { margin: 0 0 12px; font-size: 15px; }
  .summary-card ul { margin: 0; padding-left: 20px; }
  .summary-card li { margin-bottom: 10px; font-size: 13.5px; line-height: 1.55; }
  .summary-card li:last-child { margin-bottom: 0; }
  .summary-loading { color: var(--muted-2); font-size: 13px; padding: 10px 0; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon">🎧</div>
      <div>
        <div class="brand-title">PDF Reader Bot</div>
        <div class="brand-sub">Text-to-speech for your notes</div>
      </div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M14 14L18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="Search notes...">
    </div>
    <div id="progress-summary" class="progress-summary"></div>
  </div>
  <nav id="note-list" aria-label="Notes"></nav>
</div>

<div id="main">
  <div id="detail" class="empty">
    <div id="empty-state">
      <div class="big">📄</div>
      Select a PDF on the left to generate an audio version.
    </div>
  </div>
</div>

<script>
const state = { notes: [], selected: null, voices: [], pollTimer: null, collapsed: new Set() };

async function loadNotes() {
  const res = await fetch('/api/notes');
  state.notes = await res.json();
  renderList();
}

async function loadVoices() {
  try {
    const res = await fetch('/api/voices');
    state.voices = await res.json();
  } catch (e) {
    state.voices = [];
  }
}

function buildTree(notes) {
  const root = { children: new Map(), notes: [] };
  for (const n of notes) {
    const segments = n.path.split('/');
    segments.pop(); // drop filename, note.title already carries it
    let node = root;
    for (const seg of segments) {
      if (!node.children.has(seg)) node.children.set(seg, { children: new Map(), notes: [] });
      node = node.children.get(seg);
    }
    node.notes.push(n);
  }
  return root;
}

function countNotes(node) {
  let n = node.notes.length;
  for (const child of node.children.values()) n += countNotes(child);
  return n;
}

function nodeMatches(node, f) {
  if (!f) return true;
  if (node.notes.some(n => n.title.toLowerCase().includes(f))) return true;
  for (const child of node.children.values()) if (nodeMatches(child, f)) return true;
  return false;
}

function renderNode(node, f, keyPrefix) {
  const container = document.createElement('div');
  if (keyPrefix) container.className = 'tree-children';

  const childNames = [...node.children.keys()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  for (const name of childNames) {
    const child = node.children.get(name);
    if (!nodeMatches(child, f)) continue;
    const key = keyPrefix ? `${keyPrefix}/${name}` : name;

    const details = document.createElement('details');
    details.open = f ? true : !state.collapsed.has(key);
    details.addEventListener('toggle', () => {
      if (details.open) state.collapsed.delete(key); else state.collapsed.add(key);
    });

    const summary = document.createElement('summary');
    summary.className = 'folder-label';
    summary.innerHTML = `${name} <span class="count">(${countNotes(child)})</span>`;
    details.appendChild(summary);
    details.appendChild(renderNode(child, f, key));
    container.appendChild(details);
  }

  const notes = node.notes
    .filter(n => !f || n.title.toLowerCase().includes(f))
    .sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
  for (const note of notes) {
    const item = document.createElement('div');
    item.className = 'note-item' + (note.has_audio ? ' has-audio' : '') + (state.selected && state.selected.id === note.id ? ' active' : '');
    item.innerHTML = `<span class="name">${note.title}</span>` +
      `<span class="badges">${note.seen ? '<span class="seen-badge">✓ Seen</span>' : ''}<span class="audio-badge">Ready</span></span>`;
    item.onclick = () => selectNote(note);
    container.appendChild(item);
  }

  return container;
}

function renderList(filter = '') {
  updateProgressSummary();

  const container = document.getElementById('note-list');
  container.innerHTML = '';
  const f = filter.trim().toLowerCase();

  const tree = buildTree(state.notes);
  if (!nodeMatches(tree, f)) {
    container.innerHTML = '<div class="empty-msg">No matching PDFs.</div>';
    return;
  }
  container.appendChild(renderNode(tree, f, ''));
}

function updateProgressSummary() {
  const el = document.getElementById('progress-summary');
  if (!el) return;
  const total = state.notes.length;
  const seen = state.notes.filter(n => n.seen).length;
  const pct = total ? Math.round((seen / total) * 100) : 0;
  el.innerHTML = `${seen} / ${total} notes seen` +
    `<div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
}

function selectNote(note) {
  state.selected = note;
  stopPolling();
  renderList(document.getElementById('search').value);
  renderDetail();
  refreshStatus();
}

function voiceOptions() {
  const opts = ['<option value="">(default voice)</option>'];
  for (const v of state.voices) opts.push(`<option value="${v.id}">${v.name}</option>`);
  return opts.join('');
}

function breadcrumbHtml(path) {
  const parts = path.split('/');
  return parts.map((p, i) => i === parts.length - 1
    ? `<span>${p}</span>`
    : `<span>${p}</span><span class="sep">/</span>`
  ).join('');
}

function renderDetail() {
  const note = state.selected;
  const detail = document.getElementById('detail');
  detail.className = '';
  const pdfUrl = `/pdf?path=${encodeURIComponent(note.path)}`;
  detail.innerHTML = `
    <div id="detail-left">
      <div class="breadcrumb">${breadcrumbHtml(note.path)}</div>
      <h2>${note.title}</h2>
      <div class="card controls">
        <div class="field">
          <label>Voice</label>
          <select id="voice-select">${voiceOptions()}</select>
        </div>
        <div class="field">
          <label>Rate <span class="value" id="rate-val">0</span></label>
          <input id="rate-range" type="range" min="-10" max="10" value="0">
        </div>
        <button id="generate-btn">Generate audio</button>
      </div>
      <div id="status-line"></div>
      <div id="player-block"></div>
      <div class="secondary-row">
        <button id="seen-toggle-btn" class="secondary-btn" type="button"></button>
        <button id="summary-btn" class="secondary-btn" type="button">Summarize</button>
        <button id="quiz-btn" class="secondary-btn" type="button">Take quiz</button>
      </div>
      <div id="summary-block"></div>
      <div id="quiz-block"></div>
    </div>
    <div id="pdf-pane">
      <div class="pdf-pane-header">
        <span id="pdf-page-label">${note.title}.pdf</span>
        <a href="${pdfUrl}" target="_blank">Open in new tab ↗</a>
      </div>
      <iframe src="${pdfUrl}" title="${note.title} PDF preview"></iframe>
    </div>
  `;
  document.getElementById('rate-range').oninput = (e) => {
    document.getElementById('rate-val').textContent = e.target.value;
  };
  document.getElementById('generate-btn').onclick = startConversion;
  document.getElementById('seen-toggle-btn').onclick = toggleSeen;
  document.getElementById('summary-btn').onclick = startSummary;
  document.getElementById('quiz-btn').onclick = startQuiz;
  updateSeenButton();
}

function updateSeenButton() {
  const btn = document.getElementById('seen-toggle-btn');
  const note = state.selected;
  if (!btn || !note) return;
  btn.textContent = note.seen ? '✓ Marked as seen' : 'Mark as seen';
  btn.classList.toggle('active', !!note.seen);
}

async function markSeen(seen) {
  const note = state.selected;
  if (!note) return;
  try {
    await fetch('/api/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: note.id, seen })
    });
  } catch (e) { /* best effort -- local badge still updates */ }
  note.seen = seen;
  const listed = state.notes.find(n => n.id === note.id);
  if (listed) listed.seen = seen;
  updateSeenButton();
  renderList(document.getElementById('search').value);
}

function toggleSeen() {
  const note = state.selected;
  if (note) markSeen(!note.seen);
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function startSummary() {
  const note = state.selected;
  if (!note) return;
  const summaryBlock = document.getElementById('summary-block');
  summaryBlock.innerHTML = '<div class="summary-loading">Summarizing the PDF text…</div>';
  try {
    const res = await fetch(`/api/summary?path=${encodeURIComponent(note.path)}`);
    const data = await res.json();
    if (!res.ok || data.error) {
      summaryBlock.innerHTML = `<div class="error-box">${escapeHtml(data.error || 'Could not summarize this PDF.')}</div>`;
      return;
    }
    renderSummary(data.sentences);
  } catch (e) {
    summaryBlock.innerHTML = `<div class="error-box">Could not reach the server.</div>`;
  }
}

function renderSummary(sentences) {
  const summaryBlock = document.getElementById('summary-block');
  summaryBlock.innerHTML = `
    <div class="card summary-card">
      <h3>Summary</h3>
      <ul>${sentences.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
    </div>
  `;
}

async function startQuiz() {
  const note = state.selected;
  if (!note) return;
  const quizBlock = document.getElementById('quiz-block');
  quizBlock.innerHTML = '<div class="quiz-loading">Building quiz from the PDF text…</div>';
  try {
    const res = await fetch(`/api/quiz?path=${encodeURIComponent(note.path)}`);
    const data = await res.json();
    if (!res.ok || data.error) {
      quizBlock.innerHTML = `<div class="error-box">${escapeHtml(data.error || 'Could not build a quiz.')}</div>`;
      return;
    }
    renderQuiz(data.questions);
  } catch (e) {
    quizBlock.innerHTML = `<div class="error-box">Could not reach the server.</div>`;
  }
}

function contextHtml(q) {
  const parts = [];
  if (q.context_before) parts.push(`<span class="ctx-dim">${escapeHtml(q.context_before)}</span>`);
  parts.push(`<span class="ctx-main">${escapeHtml(q.context)}</span>`);
  if (q.context_after) parts.push(`<span class="ctx-dim">${escapeHtml(q.context_after)}</span>`);
  return parts.join(' ');
}

function renderQuiz(questions) {
  const quizBlock = document.getElementById('quiz-block');
  if (!questions.length) {
    quizBlock.innerHTML = `<div class="error-box">This document's text is too short to build a quiz from.</div>`;
    return;
  }
  quizBlock.innerHTML = `
    <div class="card quiz-card">
      <h3>Quick check — fill in the blank</h3>
      <form id="quiz-form">
        ${questions.map((q, i) => `
          <div class="quiz-q" data-answer="${escapeHtml(q.answer)}">
            <p>${i + 1}. ${escapeHtml(q.question)}</p>
            <div class="quiz-opts">
              ${q.options.map(opt => `
                <label class="quiz-opt">
                  <input type="radio" name="q${i}" value="${escapeHtml(opt)}" required>
                  ${escapeHtml(opt)}
                </label>
              `).join('')}
              <label class="quiz-opt quiz-opt-idk">
                <input type="radio" name="q${i}" value="__idk__">
                🤷 I don't know — show me
              </label>
            </div>
            <div class="quiz-explain">
              <strong>From the text:</strong> ${contextHtml(q)}
            </div>
          </div>
        `).join('')}
        <button type="submit">Check answers</button>
      </form>
      <div id="quiz-result"></div>
    </div>
  `;
  document.getElementById('quiz-form').onsubmit = (e) => {
    e.preventDefault();
    gradeQuiz(questions.length);
  };
}

function gradeQuiz(total) {
  const qDivs = document.querySelectorAll('.quiz-q');
  let correct = 0;
  qDivs.forEach((div) => {
    const answer = div.dataset.answer;
    const selected = div.querySelector('input:checked');
    div.querySelectorAll('.quiz-opt').forEach((label) => {
      const input = label.querySelector('input');
      label.classList.remove('correct', 'incorrect');
      if (input.value === answer) label.classList.add('correct');
      else if (selected && input.value === selected.value && input.value !== '__idk__') {
        label.classList.add('incorrect');
      }
    });
    const isCorrect = !!(selected && selected.value === answer);
    if (isCorrect) correct++;
    const explain = div.querySelector('.quiz-explain');
    if (explain) explain.classList.toggle('shown', !isCorrect);
  });
  const allGood = correct === total;
  const result = document.getElementById('quiz-result');
  result.innerHTML = `<span class="status-badge ${allGood ? 'good' : 'bad'}">Score: ${correct}/${total}</span>` +
    (allGood ? '' : `<button type="button" id="retake-btn" class="secondary-btn">Retake</button>`);
  const retakeBtn = document.getElementById('retake-btn');
  if (retakeBtn) retakeBtn.onclick = startQuiz;
}

async function startConversion() {
  const note = state.selected;
  const voice = document.getElementById('voice-select').value;
  const rate = parseInt(document.getElementById('rate-range').value, 10);
  document.getElementById('generate-btn').disabled = true;

  await fetch('/api/convert', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: note.path, voice, rate })
  });
  startPolling();
}

function startPolling() {
  stopPolling();
  refreshStatus();
  state.pollTimer = setInterval(refreshStatus, 1200);
}

function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

async function refreshStatus() {
  const note = state.selected;
  if (!note) return;
  const res = await fetch(`/api/status?id=${encodeURIComponent(note.id)}`);
  const s = await res.json();
  renderStatus(s);
  if (s.status === 'done' || s.status === 'error') stopPolling();
}

function renderStatus(s) {
  const statusLine = document.getElementById('status-line');
  const playerBlock = document.getElementById('player-block');
  const genBtn = document.getElementById('generate-btn');
  if (!statusLine) return;

  if (s.status === 'running') {
    genBtn.disabled = true;
    statusLine.innerHTML = `<span class="spinner"></span> Synthesizing track ${s.done}/${s.total || '?'}` +
      `<progress value="${s.done}" max="${Math.max(s.total, 1)}"></progress>`;
  } else if (s.status === 'error') {
    genBtn.disabled = false;
    statusLine.innerHTML = `<span class="status-badge bad">Failed</span>`;
    playerBlock.innerHTML = `<div class="error-box">${s.error || 'Something went wrong.'}</div>`;
  } else if (s.status === 'done') {
    genBtn.disabled = false;
    statusLine.innerHTML = `<span class="status-badge good">Ready</span> ${s.tracks.length} track(s)`;
    renderPlayer(s.tracks, s.pages || []);
  } else {
    genBtn.disabled = false;
    statusLine.textContent = 'No audio generated yet.';
    playerBlock.innerHTML = '';
  }
}

function renderPlayer(tracks, pages) {
  const note = state.selected;
  const playerBlock = document.getElementById('player-block');
  const base = `/audio/${note.id}`;
  const pdfUrl = `/pdf?path=${encodeURIComponent(note.path)}`;
  playerBlock.innerHTML = `
    <audio id="audio-el" controls src="${base}/${tracks[0]}"></audio>
    <ul id="track-list"></ul>
    <div class="links">
      <a href="${base}/playlist.m3u" download>Download playlist (.m3u)</a>
      <a href="${base}/transcript.txt" target="_blank">Read transcript</a>
    </div>
  `;
  const list = document.getElementById('track-list');
  const audioEl = document.getElementById('audio-el');
  const pdfFrame = document.querySelector('#pdf-pane iframe');
  const pdfLabel = document.getElementById('pdf-page-label');
  let current = 0;
  let shownPage = null;

  tracks.forEach((t, i) => {
    const li = document.createElement('li');
    const page = pages[i];
    li.innerHTML = `<span class="track-num">${i + 1}</span><span>${t}</span>` +
      (page ? `<span class="track-page">p.${page}</span>` : '');
    li.onclick = () => playTrack(i);
    list.appendChild(li);
  });

  function playTrack(i) {
    current = i;
    audioEl.src = `${base}/${tracks[i]}`;
    audioEl.play();
    [...list.children].forEach((li, idx) => li.classList.toggle('playing', idx === i));

    const page = pages[i];
    if (page && page !== shownPage && pdfFrame) {
      shownPage = page;
      pdfFrame.src = `${pdfUrl}#page=${page}`;
      if (pdfLabel) pdfLabel.textContent = `${note.title}.pdf · Page ${page}`;
    }
  }
  audioEl.onended = () => {
    if (current < tracks.length - 1) {
      playTrack(current + 1);
    } else if (!note.seen) {
      markSeen(true);
    }
  };
  playTrack(0);
}

document.getElementById('search').addEventListener('input', (e) => renderList(e.target.value));

loadNotes();
loadVoices();
</script>
